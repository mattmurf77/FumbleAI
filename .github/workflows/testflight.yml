name: TestFlight

# Manual only: GitHub > Actions > TestFlight > Run workflow.
# Setup guide: docs/setup/TESTFLIGHT.md
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      HOME_TEAM_ID: ${{ secrets.HOME_TEAM_ID }}
      HOME_BUNDLE_ID: ${{ secrets.HOME_BUNDLE_ID }}
      # Optional: the Render helper service (docs/setup/RENDER.md). Empty is fine.
      HOME_SERVER_URL: ${{ secrets.HOME_SERVER_URL }}
      HOME_API_KEY: ${{ secrets.HOME_API_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 HOME_TEAM_ID HOME_BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name (see docs/setup/TESTFLIGHT.md)"; missing=1; fi
          done
          exit $missing

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate Xcode project
        working-directory: HomeApp
        run: xcodegen generate

      - name: Build and upload (fastlane beta)
        run: bundle exec fastlane beta

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7
