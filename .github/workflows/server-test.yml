name: Server tests

on:
  pull_request:
    paths:
      - "server/**"
      - "render.yaml"
      - ".github/workflows/server-test.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "render.yaml"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: home_test
          POSTGRES_PASSWORD: local_ci_test
          POSTGRES_DB: home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_test -d home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOME_TEST_DATABASE_URL: postgres://home_test:local_ci_test@127.0.0.1:5432/home_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          npm ci --no-audit --no-fund
          node --test
