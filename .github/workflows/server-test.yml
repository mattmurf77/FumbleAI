name: Server tests

on:
  pull_request:
    paths:
      - "server/**"
      - "render.yaml"
      - ".github/workflows/server-test.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "render.yaml"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test
